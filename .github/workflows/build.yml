name: Build Smart Contacts APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android & iOS platform scaffolding
        run: flutter create . --org com.ayyash.smartcontacts

      - name: Inject Full Android Permissions & WhatsApp Queries
        run: |
          sed -i '/<manifest/a \
              <uses-permission android:name="android.permission.READ_CONTACTS"/>\
              <uses-permission android:name="android.permission.WRITE_CONTACTS"/>\
              <uses-permission android:name="android.permission.READ_CALL_LOG"/>\
              <uses-permission android:name="android.permission.READ_PHONE_STATE"/>\
              <uses-permission android:name="android.permission.READ_SMS"/>\
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\
              <queries>\
                  <package android:name="com.whatsapp"/>\
                  <package android:name="com.whatsapp.w4b"/>\
              </queries>' android/app/src/main/AndroidManifest.xml

      - name: Configure Automatic Debug Signing for Release Build
        run: |
          sed -i 's/signingConfig = signingConfigs.debug/signingConfig = signingConfigs.debug/g' android/app/build.gradle
          sed -i '/buildTypes {/,/}/ { s/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g }' android/app/build.gradle 2>/dev/null || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android APK (Signed)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartContacts-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
